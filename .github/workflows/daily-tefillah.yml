name: Daily Tefillah Email

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM ET — before morning davening
  workflow_dispatch:         # Manual trigger for testing

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # Needed to commit the updated state file

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send email and advance state
        id: send
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEFILLAH_EMAIL_RECIPIENT: ${{ secrets.TEFILLAH_EMAIL_RECIPIENT }}
        run: |
          NEXT=$(node send.js)
          echo "next_prayer=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/current_prayer.json
          git commit -m "chore: advance tefillah to prayer ${{ steps.send.outputs.next_prayer }}" || echo "No state change to commit"
          git push
